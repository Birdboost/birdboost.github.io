<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Flock admin · Birdboost</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:min(420px,100%)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
.bar h2{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;line-height:1.1}
.kpi span{font-size:13px;color:var(--mute)}
td .btn{margin:2px 0}
.linkish{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:#555;text-underline-offset:3px}
.who{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.who div{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px;font-size:14px}
.mini3d{width:100%;max-width:260px}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check input{width:auto}
.brief{white-space:pre-wrap}
.section-gap{margin-top:34px}
</style>
</head>
<body>
<div id="app"><div class="login"><span class="spin"></span></div></div>
<dialog id="dlg"><div class="dhead"><h3 id="dlgTitle"></h3><button class="x" aria-label="Close" onclick="dlg.close()">×</button></div><div class="dbody" id="dlgBody"></div></dialog>

<script src="../config.js"></script>
<script src="../viewer3d.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const CFG = window.BB_CONFIG || {};
const app = document.getElementById("app"), dlg = document.getElementById("dlg");
const TZ = "Africa/Harare";
const PORTAL_URL = new URL("../", location.href).href;
let db, user, tab = location.hash.slice(1) || "ambassadors";
let D = { ambassadors: [], tasks: [], task_done: [], events: [], event_people: [], products: [], preorders: [], sales: [], settings: {}, admins: [] };

// ---------- helpers ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
// Old-style codes (ABCDEFGH) are shown as ABCD-EFGH; fun codes (BigBird1234) as they are.
const pretty = (c) => !c ? "" : /^[A-Z0-9]{8}$/.test(c) && !/[a-z]/.test(c) ? c.slice(0, 4) + "-" + c.slice(4) : c;
const clean = (c) => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const fmt = (d, time = true) => d ? new Date(d.length === 10 ? d + "T12:00:00+02:00" : d).toLocaleString("en-GB", { timeZone: TZ, day: "numeric", month: "short", year: "numeric", ...(time && d.length > 10 ? { hour: "2-digit", minute: "2-digit" } : {}) }) : "";
const toLocalInput = (iso) => iso ? new Date(new Date(iso).getTime() + 2 * 3600e3).toISOString().slice(0, 16) : ""; // Harare is UTC+2 all year
const fromLocalInput = (v) => v ? v + ":00+02:00" : null;
const todayHarare = () => new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10);
const money = (n, cur) => n == null ? "" : new Intl.NumberFormat("en", { style: "currency", currency: cur || "USD" }).format(n);
const byId = (list, id) => list.find((x) => x.id === id);
function toast(msg, bad) { const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg; t.setAttribute("role", "status"); document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
const ERR = { store_code_taken: "That store code is already used by another ambassador.", name_required: "Add the ambassador's name.", not_admin: "This login isn't on the admin list.", "duplicate key": "That already exists.", code_taken: "Another ambassador already has that access code. Pick a different one.", code_length: "Access codes need 8 to 30 letters and numbers.", code_mix: "Access codes need both letters and numbers, like BigBird1234." };
const errText = (e) => { const m = (e && e.message) || String(e); for (const k in ERR) if (m.includes(k)) return ERR[k]; return m; };
const ok = ({ data, error }) => { if (error) throw error; return data; };
function openDlg(title, html) { document.getElementById("dlgTitle").textContent = title; document.getElementById("dlgBody").innerHTML = html; if (!dlg.open) dlg.showModal(); dlg.querySelector(".dbody").scrollTop = 0; }
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
// Errors already shown to the admin as a message don't need to go anywhere else.
addEventListener("unhandledrejection", (e) => { if (e.reason && e.reason.__shown) e.preventDefault(); });
async function busy(btn, fn, msg) {
  const old = btn && btn.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { const r = await fn(); if (msg) toast(msg); return r; }
  catch (e) { toast(errText(e), 1); try { e.__shown = true; } catch {} throw e; }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}
function codeState(a) {
  if (a.code_status === "revoked") return '<span class="pill bad">Revoked</span>';
  if (a.code_expires_at && new Date(a.code_expires_at) < new Date()) return '<span class="pill warn">Expired</span>';
  return '<span class="pill g">Active</span>' + (a.code_expires_at ? `<div class="small mute">until ${fmt(a.code_expires_at, false)}</div>` : "");
}
// Simple form builder: fields = [{k, label, type, hint, options, req, full}]
function fieldsHtml(fields, v = {}) {
  return fields.map((f) => {
    const val = v[f.k] ?? f.def ?? "";
    const req = f.req ? " required" : "";
    let input;
    if (f.type === "textarea") input = `<textarea name="${f.k}"${req}>${esc(val)}</textarea>`;
    else if (f.type === "select") input = `<select name="${f.k}"${req}>${f.options.map(([ov, ol]) => `<option value="${esc(ov)}"${String(ov) === String(val) ? " selected" : ""}>${esc(ol)}</option>`).join("")}</select>`;
    else if (f.type === "check") return `<label class="check"><input type="checkbox" name="${f.k}"${val ? " checked" : ""}> ${esc(f.label)}</label>`;
    else input = `<input name="${f.k}" type="${f.type || "text"}" value="${esc(val)}"${req}${f.step ? ` step="${f.step}"` : ""}${f.accept ? ` accept="${f.accept}"` : ""}${f.ph ? ` placeholder="${esc(f.ph)}"` : ""}>`;
    return `<label${f.full ? ' style="grid-column:1/-1"' : ""}>${esc(f.label)}${f.req ? " *" : ""}${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</label>`;
  }).join("");
}
function readForm(form, fields) {
  const out = {};
  for (const f of fields) {
    const el = form.elements[f.k]; if (!el || f.type === "file") continue;
    if (f.type === "check") out[f.k] = el.checked;
    else if (f.type === "number") out[f.k] = el.value === "" ? null : Number(el.value);
    else out[f.k] = el.value.trim() === "" ? null : el.value.trim();
  }
  return out;
}

// ---------- data ----------
async function loadAll() {
  const t = (name, order = "created_at", asc = false) => db.from(name).select("*").order(order, { ascending: asc });
  const [a, tk, td, ev, ep, pr, po, sa, st, ad] = await Promise.all([
    t("ambassadors", "full_name", true), t("tasks"), db.from("task_done").select("*"), t("events", "starts_at", true),
    db.from("event_people").select("*"), t("products", "sort_order", true), t("preorders"), t("sales", "sold_on"), db.from("settings").select("*"), db.from("admins").select("*")]);
  D = { ambassadors: ok(a), tasks: ok(tk), task_done: ok(td), events: ok(ev), event_people: ok(ep), products: ok(pr), preorders: ok(po), sales: ok(sa),
        settings: Object.fromEntries(ok(st).map((r) => [r.key, r.value])), admins: ok(ad) };
}
async function refresh() { await loadAll(); render(); }

// ---------- login ----------
function showLogin(msg = "") {
  app.innerHTML = `<main class="login"><div class="box">
    <a class="brand" href="${PORTAL_URL}"><span class="logo"></span>BIRDBOOST</a>
    <h1 style="margin:20px 0 6px">Flock <span style="color:var(--g)">admin</span></h1>
    <p class="mute">For the Birdboost team only.</p>
    <form id="lf" class="card" style="margin-top:16px">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="pw" type="password" autocomplete="current-password" required></label>
      <p id="lerr" role="alert" style="color:var(--bad);min-height:1.2em">${esc(msg)}</p>
      <button class="btn g" style="width:100%">Log in</button>
    </form></div></main>`;
  document.getElementById("lf").onsubmit = async (e) => {
    e.preventDefault(); const f = e.target, b = f.querySelector("button");
    b.disabled = true;
    const { error } = await db.auth.signInWithPassword({ email: f.email.value.trim(), password: f.pw.value });
    if (error) { document.getElementById("lerr").textContent = /invalid/i.test(error.message) ? "Wrong email or password." : error.message; b.disabled = false; return; }
    start();
  };
}
async function start() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return showLogin();
  user = session.user;
  const { data: isAdmin, error } = await db.rpc("is_admin");
  if (error || !isAdmin) { await db.auth.signOut(); return showLogin(error ? errText(error) : `${user.email} isn't on the admin list. Ask an existing admin to add you in Settings.`); }
  try { await refresh(); } catch (e) { app.innerHTML = `<main class="login"><div class="box card"><h2>Couldn't load</h2><p>${esc(errText(e))}</p><p class="small mute">If this is a new setup, check that database.sql ran without errors.</p></div></main>`; }
}

// ---------- shell ----------
const TABS = [["ambassadors", "Ambassadors"], ["tasks", "Tasks"], ["events", "Events"], ["merch", "Preview store"], ["sales", "Sales"], ["settings", "Settings"]];
function render() {
  app.innerHTML = `<header class="top"><div class="wrap"><a class="brand" href="#ambassadors"><span class="logo"></span>FLOCK ADMIN</a><span class="sp"></span>
    <a class="btn sm" href="${PORTAL_URL}" target="_blank" rel="noopener">Ambassador view</a><button class="btn sm" id="rf">Refresh</button><button class="btn sm" id="out">Log out</button></div>
    <div class="wrap"><nav class="tabs" role="tablist">${TABS.map(([k, n]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${n}</button>`).join("")}</nav></div></header>
    <main class="wrap"><section class="view" id="view"></section></main>`;
  document.getElementById("out").onclick = async () => { await db.auth.signOut(); showLogin(); };
  document.getElementById("rf").onclick = (e) => busy(e.currentTarget, refresh, "Up to date");
  app.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; history.replaceState(null, "", "#" + tab); render(); });
  const v = document.getElementById("view");
  ({ ambassadors: vAmb, tasks: vTasks, events: vEvents, merch: vMerch, sales: vSales, settings: vSettings }[tab] || vAmb)(v);
}

// ================= AMBASSADORS =================
const AMB_FIELDS = [
  { k: "full_name", label: "Full name", req: true },
  { k: "phone", label: "WhatsApp number", type: "tel", hint: "With country code, e.g. +263 77 123 4567" },
  { k: "email", label: "Email", type: "email" },
  { k: "city", label: "City or town" },
  { k: "instagram", label: "Instagram handle" },
  { k: "tiktok", label: "TikTok handle" },
  { k: "notes", label: "Notes (only admins see this)", type: "textarea", full: true },
];
const VALIDITY = [["", "Never expires"], ["30", "30 days"], ["90", "90 days"], ["180", "6 months"], ["365", "1 year"]];
function salesQty(id) { return D.sales.filter((s) => s.ambassador_id === id).reduce((n, s) => n + (s.quantity || 0), 0); }
function statusPill(a) { return a.is_active === false ? '<span class="pill bad">🔴 Inactive</span>' : '<span class="pill g">🟢 Active</span>'; }
function codeNote(a) {
  if (a.code_status === "revoked") return '<div class="small" style="color:var(--bad)">Code revoked</div>';
  if (a.code_expires_at && new Date(a.code_expires_at) < new Date()) return '<div class="small" style="color:var(--warn)">Code expired</div>';
  return a.code_expires_at ? `<div class="small mute">until ${fmt(a.code_expires_at, false)}</div>` : "";
}
function vAmb(v) {
  const n = D.ambassadors.length, active = D.ambassadors.filter((a) => a.is_active !== false).length;
  v.innerHTML = `<div class="bar"><h2>Ambassadors</h2><button class="btn g" id="add">+ Add ambassador</button></div>
    <div class="kpis"><div class="kpi"><b>${n}</b><span>ambassadors</span></div><div class="kpi"><b>${active}</b><span>active accounts</span></div>
      <div class="kpi"><b>${D.ambassadors.filter((a) => a.code_last_used).length}</b><span>have logged in</span></div></div>
    ${n ? `<input id="q" placeholder="Search by name, city, store code or access code" style="margin-bottom:12px">
    <div class="tablewrap"><table><thead><tr><th>Ambassador</th><th>Status</th><th>Access code</th><th>Actions</th><th>Last login</th><th>Tasks</th><th>Sold</th></tr></thead><tbody id="rows"></tbody></table></div>`
    : `<div class="empty">No ambassadors yet. Pick people from your applications, then press “Add ambassador”.</div>`}`;
  document.getElementById("add").onclick = addAmbassador;
  const rows = document.getElementById("rows"); if (!rows) return;
  const draw = (q = "") => {
    q = q.toLowerCase();
    rows.innerHTML = D.ambassadors.filter((a) => !q || [a.full_name, a.city, a.store_code, a.access_code].join(" ").toLowerCase().includes(q)).map((a) => `<tr${a.is_active === false ? ' style="opacity:.75"' : ""}>
      <td><button class="linkish" data-open="${a.id}">${esc(a.full_name)}</button><div class="small mute">${esc(a.city || "")}${a.city ? " · " : ""}store code <code>${esc(a.store_code)}</code></div></td>
      <td>${statusPill(a)}</td>
      <td><code style="font-weight:700">${esc(pretty(a.access_code))}</code>${codeNote(a)}</td>
      <td><div class="row" style="flex-wrap:nowrap">${a.is_active === false ? `<button class="btn g sm" data-act="${a.id}">Activate</button>` : `<button class="btn bad sm" data-deact="${a.id}">Deactivate</button>`}
        <button class="btn sm" data-code="${a.id}">Change code</button><button class="btn sm" data-open="${a.id}">Manage</button></div></td>
      <td class="small">${a.code_last_used ? fmt(a.code_last_used) : '<span class="mute">Never</span>'}</td>
      <td>${D.task_done.filter((t) => t.ambassador_id === a.id).length}</td><td>${salesQty(a.id)}</td></tr>`).join("");
    rows.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => manageAmbassador(b.dataset.open));
    rows.querySelectorAll("[data-code]").forEach((b) => b.onclick = () => changeCode(b.dataset.code));
    rows.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => setActive(b, b.dataset.act, true));
    rows.querySelectorAll("[data-deact]").forEach((b) => b.onclick = () => setActive(b, b.dataset.deact, false));
  };
  draw(); document.getElementById("q").oninput = (e) => draw(e.target.value);
}
// Switch an account on or off. Nothing is deleted: the code, history and sales stay.
async function setActive(btn, id, on, after) {
  const a = byId(D.ambassadors, id);
  if (!on && !confirm(`Deactivate ${a.full_name}?\n\nThey lose access to the portal straight away, even with their code. Nothing is deleted, and you can activate them again any time.`)) return;
  await busy(btn, async () => ok(await db.from("ambassadors").update({ is_active: on }).eq("id", id)), on ? `${a.full_name} is active again` : `${a.full_name} is now inactive`);
  await loadAll(); render(); if (after) after();
}

// ---------- Access code picker ----------
// Shows ONE suggested code. "Shuffle" swaps it for a different one. "Use this code"
// confirms it. Suggestions are never saved: only a confirmed code is, and only when
// the admin finishes (creating the account, or replacing the code).
function codePickerHtml(title = "Access code") {
  return `<div style="grid-column:1/-1;margin:4px 0 14px" id="picker">
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">${esc(title)}</div>
    <div class="codebox" id="pcode" aria-live="polite"><span class="spin"></span></div>
    <p class="small mute" id="pstate" style="margin:8px 0">Not saved yet. Shuffle until you like it, then press “Use this code”.</p>
    <div class="row" id="pbtns"><button type="button" class="btn" id="shuf">↻ Shuffle</button><button type="button" class="btn g" id="useit" disabled>✓ Use this code</button></div>
  </div>`;
}
function mountPicker({ onConfirm, confirmLabel = "✓ Use this code" } = {}) {
  const box = document.getElementById("pcode"), st = document.getElementById("pstate"), shuf = document.getElementById("shuf"), use = document.getElementById("useit");
  use.textContent = confirmLabel;
  const P = { code: null, confirmed: false };
  const show = () => { box.textContent = P.code || ""; box.style.borderStyle = P.confirmed ? "solid" : "dashed"; };
  P.shuffle = async () => {
    P.confirmed = false; shuf.disabled = use.disabled = true; box.innerHTML = '<span class="spin"></span>';
    try {
      let next, tries = 0;
      do { next = ok(await db.rpc("admin_suggest_codes", { p_count: 1 }))[0]; } while (next === P.code && ++tries < 5);
      P.code = next; show();
      st.textContent = "Not saved yet. Shuffle until you like it, then press “Use this code”.";
    } catch (e) { box.textContent = "—"; st.textContent = "Couldn't make a code: " + errText(e); }
    shuf.disabled = false; use.disabled = !P.code;
    use.style.display = ""; shuf.textContent = "↻ Shuffle";
  };
  P.reset = () => { P.confirmed = false; use.style.display = ""; shuf.textContent = "↻ Shuffle"; show(); st.textContent = "Not saved yet. Shuffle until you like it, then press “Use this code”."; };
  shuf.onclick = () => P.confirmed ? P.reset() : P.shuffle();
  use.onclick = async () => {
    if (!P.code) return;
    if (onConfirm) return onConfirm(P.code, use);
    P.confirmed = true; show(); use.style.display = "none"; shuf.textContent = "Change";
    st.innerHTML = `<span style="color:var(--g2);font-weight:700">✓ Code chosen.</span> It's saved when you create the account.`;
  };
  P.shuffle();
  return P;
}

function addAmbassador() {
  const extra = [{ k: "store_code", label: "Store code", hint: "Leave empty to make one from their name. Letters and numbers only." }, { k: "valid", label: "Access code lasts", type: "select", options: VALIDITY }];
  openDlg("Add ambassador", `<form id="f"><div class="grid2">${fieldsHtml([...AMB_FIELDS.slice(0, 6), ...extra])}${codePickerHtml()}${fieldsHtml([AMB_FIELDS[6]])}</div><button class="btn g" id="create">Create account</button></form>`);
  const picker = mountPicker();
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault(); const f = e.target, v = readForm(f, [...AMB_FIELDS, ...extra]);
    if (!picker.confirmed) { toast("Choose the access code first: press “Use this code”.", 1); document.getElementById("picker").scrollIntoView({ block: "center" }); return; }
    let a;
    try {
      a = await busy(document.getElementById("create"), async () => ok(await db.rpc("admin_create_ambassador", {
        p_full_name: v.full_name, p_phone: v.phone, p_email: v.email, p_city: v.city, p_instagram: v.instagram, p_tiktok: v.tiktok,
        p_notes: v.notes, p_store_code: v.store_code, p_valid_days: v.valid ? +v.valid : null, p_access_code: picker.code })), "Ambassador created");
    } catch (err) { if (/code_taken/.test(err.message || "")) picker.shuffle(); return; }
    await loadAll(); render(); showInvite(a, true);
  };
}
// Replace an ambassador's code: warn first, pick one, confirm, then save.
function changeCode(id, back) {
  const a = byId(D.ambassadors, id); if (!a) return;
  openDlg("Change code: " + a.full_name, `<div class="card" style="border-color:#5a4a1a;background:#1f1b0f;margin-bottom:14px" role="note">
      <b style="color:var(--warn)">⚠ This replaces ${esc(a.full_name)}'s current code</b>
      <p class="small" style="margin:6px 0 0">Current code: <code style="font-weight:700">${esc(pretty(a.access_code))}</code>. Once you confirm a new one, the old code stops working straight away and they'll need the new code to log in.</p></div>
    <div class="grid2">${codePickerHtml("New access code")}</div>
    <div class="row"><button type="button" class="btn" id="cancel">Cancel</button></div>`);
  document.getElementById("cancel").onclick = () => back ? manageAmbassador(id) : dlg.close();
  mountPicker({ confirmLabel: "✓ Use this code", onConfirm: async (code, btn) => {
    if (!confirm(`Replace ${pretty(a.access_code)} with ${code}?\n\nThe old code stops working straight away.`)) return;
    let r;
    try { r = await busy(btn, async () => ok(await db.rpc("admin_new_access_code", { p_id: id, p_valid_days: null, p_access_code: code })), "New code saved"); }
    catch (err) { return; }
    await loadAll(); render(); showInvite(r);
  } });
}
function inviteText(a) {
  return `Welcome to the Birdboost Flock, ${a.full_name.split(" ")[0]}!\n\nLog in to the ambassador portal here: ${PORTAL_URL}\nYour access code: ${pretty(a.access_code)}\n\nYour store code: ${a.store_code}\nWhen someone buys a piece, ask them to give your store code so the sale counts for you.\n\nKeep your access code private.`;
}
function waLink(a) {
  let p = String(a.phone || "").replace(/\D/g, "");
  if (p.startsWith("0")) p = "263" + p.slice(1); // local Zimbabwe number
  return p ? `https://wa.me/${p}?text=${encodeURIComponent(inviteText(a))}` : `https://wa.me/?text=${encodeURIComponent(inviteText(a))}`;
}
function showInvite(a, isNew) {
  openDlg(isNew ? "Account created" : "Access code", `<p>${isNew ? "Send this to " : "Access code for "}<b>${esc(a.full_name)}</b>.</p>
    <div class="codebox">${esc(pretty(a.access_code))}</div>
    <p class="small mute" style="margin-top:8px">Store code: <b>${esc(a.store_code)}</b>${a.code_expires_at ? ` · works until ${fmt(a.code_expires_at, false)}` : " · never expires"}</p>
    <label>Message to send<textarea readonly style="min-height:170px">${esc(inviteText(a))}</textarea></label>
    <div class="row"><button class="btn g" id="cp">Copy message</button><a class="btn" href="${esc(waLink(a))}" target="_blank" rel="noopener">Send on WhatsApp</a>
    ${isNew ? "" : `<button class="btn" id="back">Back</button>`}</div>`);

    ${unmatched.length ? `<p style="color:var(--warn)">${unmatched.length} sale(s) used a store code that doesn't belong to any ambassador. They're marked below.</p>` : ""}
    <h3>All sales</h3>
    ${D.sales.length ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Code</th><th>Ambassador</th><th>Item</th><th>Qty</th><th>Amount</th><th>Customer</th><th></th></tr></thead><tbody>
      ${D.sales.map((s) => `<tr><td class="small">${fmt(s.sold_on, false)}</td><td><code>${esc(s.store_code)}</code></td>
      <td>${s.ambassador_id ? esc(byId(D.ambassadors, s.ambassador_id)?.full_name) : '<span class="pill warn">No match</span>'}</td>
      <td>${esc(s.item || "")}</td><td>${s.quantity}</td><td>${esc(money(s.amount, s.currency))}</td><td class="small">${esc(s.customer || "")}</td>
      <td><button class="btn bad sm" data-del="${s.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>` : ""}`;
  const f = document.getElementById("sf"), who = document.getElementById("who");
  f.store_code.oninput = () => { const c = clean(f.store_code.value), a = D.ambassadors.find((x) => x.store_code === c);
    who.innerHTML = !c ? "The code the customer gave." : a ? `<span style="color:var(--g2)">✓ ${esc(a.full_name)}</span>` : `<span style="color:var(--warn)">No ambassador has this code</span>`; };
  f.onsubmit = async (e) => { e.preventDefault();
    const vals = { store_code: clean(f.store_code.value), product_id: f.product_id.value || null, item: f.item.value.trim() || null, quantity: +f.quantity.value || 1,
      amount: f.amount.value === "" ? null : +f.amount.value, currency: (f.currency.value.trim() || "USD").toUpperCase(), customer: f.customer.value.trim() || null, sold_on: f.sold_on.value, note: f.note.value.trim() || null };
    if (vals.product_id && !vals.item) vals.item = byId(D.products, vals.product_id).name;
    if (!D.ambassadors.some((a) => a.store_code === vals.store_code) && !confirm("No ambassador has this store code. Save the sale anyway?")) return;
    await busy(f.querySelector("button"), async () => ok(await db.from("sales").insert(vals)), "Sale saved"); refresh(); };
  v.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => { if (!confirm("Delete this sale?")) return;
    await busy(b, async () => ok(await db.from("sales").delete().eq("id", b.dataset.del)), "Deleted"); refresh(); });
  document.getElementById("csv").onclick = () => {
    const rows = [["date", "store_code", "ambassador", "item", "quantity", "amount", "currency", "customer", "note"],
      ...D.sales.map((s) => [s.sold_on, s.store_code, byId(D.ambassadors, s.ambassador_id)?.full_name || "", s.item, s.quantity, s.amount, s.currency, s.customer, s.note])];
    const csv = rows.map((r) => r.map((x) => `"${String(x ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `birdboost-sales-${todayHarare()}.csv`; a.click();
  };
}

      <label style="grid-column:1/-1">Welcome message on the ambassador home page<textarea name="welcome_message">${esc(S.welcome_message || "")}</textarea></label>
      <label>Instagram handle<input name="instagram" value="${esc(S.instagram || "")}"></label>
      <label>TikTok handle<input name="tiktok" value="${esc(S.tiktok || "")}"></label></div>
      <button class="btn g">Save settings</button></form>
    <div class="card" style="margin-bottom:22px"><h3>Links</h3>

    <div class="card"><h3>Admins</h3><p class="small mute">To add an admin: put their email here, then create a login for the same email in Supabase (Authentication, Users, Add user).</p>
      <div class="who">${D.admins.map((a) => `<div><span>${esc(a.email)}</span>${a.email.toLowerCase() === user.email.toLowerCase() ? '<span class="mute">You</span>' : `<button class="btn bad sm" data-rm="${esc(a.email)}">Remove</button>`}</div>`).join("")}</div>
      <form id="af" class="row" style="margin-top:12px"><input name="email" type="email" placeholder="email@example.com" required style="flex:1;min-width:200px"><button class="btn">Add admin</button></form></div>`;
  document.getElementById("sf").onsubmit = async (e) => { e.preventDefault(); const f = e.target;
    const rows = ["whatsapp_link", "welcome_message", "instagram", "tiktok"].map((k) => ({ key: k, value: f.elements[k].value.trim() || null }));
    await busy(f.querySelector("button"), async () => ok(await db.from("settings").upsert(rows)), "Settings saved"); refresh(); };
  document.getElementById("af").onsubmit = async (e) => { e.preventDefault();
    await busy(e.target.querySelector("button"), async () => ok(await db.from("admins").insert({ email: e.target.email.value.trim().toLowerCase() })), "Admin added"); refresh(); };
  v.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => { if (!confirm(`Remove ${b.dataset.rm} as an admin?`)) return;
    await busy(b, async () => ok(await db.from("admins").delete().eq("email", b.dataset.rm)), "Removed"); refresh(); });
}

})();
