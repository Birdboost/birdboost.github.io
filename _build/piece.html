<!DOCTYPE html>
<html lang="en" data-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Nest · Birdboost</title>
<meta name="description" content="A Birdboost piece: the details, the fit, and the people wearing it.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="../../assets/logo.png">
<!--HEAD-->
<link rel="stylesheet" href="../../assets/bb.css">
<link rel="stylesheet" href="../../assets/shop.css">
<style>
.pg{padding:84px 0 0}
.crumbs{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute);padding:18px 0}
.crumbs a{color:var(--mute);text-decoration:none}.crumbs a:hover{color:var(--ink)}
.pv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:start}

/* gallery: a column of big images on desktop, a swipe on phones */
.gal{display:grid;gap:10px}
.gal figure{margin:0;position:relative;background:#111;overflow:hidden;cursor:zoom-in}
.gal figure img{width:100%;aspect-ratio:333/385;object-fit:cover}
.gal figure.wide img{aspect-ratio:4/3}
.gal figcaption{position:absolute;left:12px;bottom:10px;font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px #000}
.gal .g3d{aspect-ratio:1;cursor:grab}
.gal .g3d .stage3d{height:100%}
.galbar{display:none}
.v3d{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}

/* the panel stays with you as the pictures scroll past */
.panel{position:sticky;top:88px;display:flex;flex-direction:column;gap:20px;padding-bottom:40px}
.panel h1{font:400 clamp(48px,5.4vw,84px)/.88 var(--display);text-transform:uppercase}
.panel .sub{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px}
.panel .price{font:400 34px var(--display)}
.panel .price.soft{font:600 14px var(--sans);color:var(--mute)}
.panel .lead{font:400 21px/1.35 var(--serif);font-style:italic;color:#e3e3db;margin:0}
.cols{display:flex;gap:10px;flex-wrap:wrap}
.cols a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:12px;width:64px}
.cols a img{width:64px;height:74px;object-fit:cover;outline:1px solid transparent;outline-offset:2px}
.cols a[aria-current=true]{color:var(--ink)}
.cols a[aria-current=true] img{outline-color:var(--ink)}
.sizehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fmsbtn{background:none;border:0;color:var(--g2);font:600 14px var(--sans);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
.fitnote{font-size:13px;color:var(--mute);margin:8px 0 0}
.fitnote b{color:var(--g2);font-weight:600}
.addrow{display:flex;gap:10px;align-items:stretch}
.addrow .btn{flex:1}
.note{font-size:13px;color:var(--mute);margin:0}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:18px 0;cursor:pointer;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font:400 22px var(--sans);transition:transform .3s}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc .ab{padding:0 0 20px;color:#d4d4ce}
.acc .ab p{margin:0 0 10px}
.chart{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.chart th,.chart td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.chart th{font-weight:600;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

.after{padding:clamp(70px,9vw,130px) 0 0}
.after+.after{padding-top:clamp(50px,7vw,90px)}
.after .secthead h2{font-size:clamp(40px,5.5vw,80px)}
.rel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.rel a{text-decoration:none;color:inherit}
.rel img{aspect-ratio:333/385;object-fit:cover;margin-bottom:10px;transition:opacity .4s}
.rel a:hover img{opacity:.85}
.rel b{font-weight:600;font-size:15px}.rel span{display:block;color:var(--mute);font-size:14px}
.seenempty{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0}
.seenempty p{margin:0;font:400 24px/1.3 var(--serif);font-style:italic;max-width:30em}
.missing{padding:160px 0;text-align:center}

/* phones: swipe the photos, the add button rides along at the bottom */
@media(max-width:900px){
  .pg{padding-top:60px}
  .crumbs{padding:12px 0}
  .pv{grid-template-columns:minmax(0,1fr);gap:20px}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;margin:0 -20px;padding:0 20px;scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .gal figure{flex:0 0 88%;scroll-snap-align:center}
  .gal figure.wide img{aspect-ratio:333/385}
  .gal .g3d{aspect-ratio:333/385}
  .galbar{display:flex;justify-content:center;gap:6px;margin-top:10px}
  .galbar i{width:6px;height:6px;border-radius:50%;background:#ffffff40;transition:background .3s,width .3s}
  .galbar i.on{background:var(--ink);width:18px;border-radius:3px}
  .panel{position:static;padding-bottom:0}
  .addrow{position:sticky;bottom:0;z-index:5;margin:0 -20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%)}
  .rel{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 10px}
}
</style>
</head>
<body class="grain" data-bird="solo" data-bird-delay="900">
<!--NAV-->

<main class="pg">
  <div class="wrap" id="piece"><div class="missing" id="loading"><p class="mute">Opening the piece…</p></div></div>

  <section class="after" id="seen" hidden aria-labelledby="h-seen">
    <div class="wrap secthead"><h2 id="h-seen">Seen in <span class="serif">the Flock</span></h2><p id="seensub">This piece, worn by real people.</p></div>
    <div class="sf" id="strip"><div class="sf-row"></div></div>
    <div class="wrap"><div class="seenempty" id="seenempty" hidden><p>Nobody has shared a photo in this piece yet. When yours arrives, post it with #SeenInTheFlock.</p><a class="btn o" href="../../flock/share/">Share your fit</a></div></div>
  </section>

  <section class="after" id="onamb" hidden aria-labelledby="h-amb">
    <div class="wrap"><div class="secthead"><h2 id="h-amb">Worn by our <span class="serif">ambassadors</span></h2></div><div class="people" id="ambs"></div></div>
  </section>

  <section class="after" id="more" hidden aria-labelledby="h-more">
    <div class="wrap"><div class="secthead"><h2 id="h-more">More from <span class="serif">the Nest</span></h2><p><a class="link-u" href="../">Everything in the Nest →</a></p></div><div class="rel" id="rel"></div></div>
  </section>
</main>

<!--FOOT-->

<script src="../../portal/config.js"></script>
<script src="../../assets/catalog.js"></script>
<script src="../../portal/viewer3d.js"></script>
<script src="../../assets/site.js"></script>
<script src="../../assets/shop.js"></script>
<script src="../../assets/community.js"></script>
<script src="../../assets/bird.js"></script>
<script>
{
const { esc, store, root } = window.BB, S = window.BBShop, C = window.BBCommunity;
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get("id") || "";
const FIT = { fitted: "Fitted: close to the body.", regular: "Regular fit: true to size.", relaxed: "Relaxed fit: a little room through the body.", oversized: "Oversized: cut big on purpose. Size down for a closer fit." };

S.load().then((list) => {
  const p = list.find((x) => x.id === id) || list.find((x) => x.uuid === id);
  if (!p) { $("piece").innerHTML = `<div class="missing"><h1 style="font:400 60px/1 var(--display);text-transform:uppercase">Not in the Nest</h1><p class="mute">This piece isn't available right now.</p><a class="btn w" href="../">See everything in the Nest</a></div>`; return; }
  document.title = `${p.style}${p.color ? " · " + p.color : ""} · Birdboost`;
  const sib = S.siblings(list, p);
  const pics = [{ src: p.image, label: "Front" }];
  if (p.back) pics.push({ src: p.back, label: "Back" });
  (p.gallery || []).forEach((g) => pics.push(typeof g === "string" ? { src: g } : g));
  const chart = p.chart && typeof p.chart === "object" && Object.keys(p.chart).length ? p.chart : null;
  const fit = store.get("bb-fit", null), rec = fit ? S.recommend(p, fit) : null;

  $("piece").innerHTML = `<nav class="crumbs" aria-label="Breadcrumb"><a href="../">The Nest</a><span aria-hidden="true">/</span><a href="../">${esc(p.category || "Pieces")}</a><span aria-hidden="true">/</span><span>${esc(p.style)}</span></nav>
  <div class="pv">
    <div>
      <div class="gal" id="gal">${pics.map((g, i) => `<figure class="${g.wide ? "wide" : ""}" data-z="${i}"><img src="${esc(S.img(g.src))}" alt="${esc(p.style)}${p.color ? " in " + esc(p.color) : ""}${g.label ? ", " + esc(g.label.toLowerCase()) : ""}" ${i ? 'loading="lazy"' : ""} width="333" height="385">${g.label || g.caption ? `<figcaption>${esc(g.caption || g.label)}</figcaption>` : ""}</figure>`).join("")}
        ${p.model || p.back ? `<figure class="g3d" id="g3d" aria-label="${p.model ? "3D view" : "360° view"}"><div id="v3" style="height:100%"></div><figcaption>${p.model ? "3D · drag to turn" : "360° · drag to turn"}</figcaption></figure>` : ""}</div>
      <div class="galbar" id="galbar" aria-hidden="true"></div>
    </div>
    <div class="panel">
      ${p.badge ? `<span class="eyebrow-s">${esc(p.badge)}</span>` : ""}
      <h1>${esc(p.style)}</h1>
      <div class="sub"><span>${esc(p.color || "")}</span>${p.price != null ? `<span class="price">${esc(S.money(p.price, p.currency))}</span>` : `<span class="price soft">Price confirmed when we contact you</span>`}</div>
      ${p.description ? `<p class="lead">${esc(p.description)}</p>` : ""}
      ${sib.length > 1 ? `<div><div class="lbl">Colour · ${esc(p.color)}</div><div class="cols">${sib.map((s) => `<a href="${esc(S.pieceUrl(s))}"${s.id === p.id ? ' aria-current="true"' : ""}><img src="${esc(S.img(s.image))}" alt=""><span>${esc(s.color)}</span></a>`).join("")}</div></div>` : ""}
      <form id="pf" novalidate>
        ${p.sizes.length ? `<div class="sizehead"><div class="lbl" id="szl" style="margin:0">Size</div><button class="fmsbtn" type="button" id="fms">Find my size</button></div>
        <div class="sizes" id="sz" role="radiogroup" aria-labelledby="szl" style="margin-top:10px">${p.sizes.map((s) => `<label><input type="radio" name="size" value="${esc(s)}"><span>${esc(s)}</span>${rec && rec.size === s ? '<b class="rec-dot">For you</b>' : ""}</label>`).join("")}</div>
        <p class="fitnote" id="fitnote">${rec ? `<b>We'd suggest ${esc(rec.size)}</b> from your last answers. <button class="fmsbtn" type="button" data-refit style="font-size:13px;color:var(--mute)">Change</button>` : esc(FIT[p.fit] || "Not sure of your size? Find my size takes ten seconds.")}</p>` : ""}
        <p class="err" id="perr" role="alert" style="margin-top:8px"></p>
        <div class="addrow" style="margin-top:12px"><div class="qty"><button type="button" data-q="-1" aria-label="One less">−</button><output id="qv">1</output><button type="button" data-q="1" aria-label="One more">+</button></div><button class="btn w" type="submit">Add to order</button></div>
      </form>
      <p class="note">Place your order on the site and Birdboost contacts you to arrange delivery or collection and payment. Nothing is paid online.</p>
      <div class="acc">
        <details open><summary>Fit and size</summary><div class="ab">
          <p>${esc(FIT[p.fit] || "A unisex fit.")} ${p.sizes.length ? "Available in " + esc(p.sizes.join(", ")) + "." : ""}</p>
          ${chart ? `<table class="chart"><thead><tr><th>Size</th><th>Chest, flat</th><th>Length</th></tr></thead><tbody>${p.sizes.filter((s) => chart[s]).map((s) => `<tr><td>${esc(s)}</td><td>${esc(chart[s].chest)} cm</td><td>${esc(chart[s].length || "–")} cm</td></tr>`).join("")}</tbody></table>` : `<p class="mute" style="font-size:14px">Exact measurements for this piece are coming soon. Until then, Find my size uses a general unisex guide.</p>`}
        </div></details>
        ${p.story ? `<details><summary>The story</summary><div class="ab"><p>${esc(p.story)}</p></div></details>` : ""}
        ${p.material || p.care ? `<details><summary>Material and care</summary><div class="ab">${p.material ? `<p>${esc(p.material)}</p>` : ""}${p.care ? `<p>${esc(p.care)}</p>` : ""}</div></details>` : ""}
        ${p.styling ? `<details><summary>How to wear it</summary><div class="ab"><p>${esc(p.styling)}</p></div></details>` : ""}
      </div>
    </div>
  </div>`;

  /* gallery: zoom on tap, dots on phones, 3D when it scrolls into view */
  const gal = $("gal");
  gal.addEventListener("click", (e) => { const f = e.target.closest("[data-z]"); if (f) S.openZoom(S.img(pics[+f.dataset.z].src), p.style); });
  const figs = gal.querySelectorAll("figure");
  $("galbar").innerHTML = [...figs].map((_, i) => `<i${i ? "" : ' class="on"'}></i>`).join("");
  gal.addEventListener("scroll", () => { const i = Math.round(gal.scrollLeft / (figs[0].offsetWidth + 6)); $("galbar").querySelectorAll("i").forEach((d, k) => d.classList.toggle("on", k === i)); }, { passive: true });
  const v3 = $("v3");
  if (v3 && window.BB3D) new IntersectionObserver((es, io) => { if (es[0].isIntersecting) { io.disconnect(); BB3D.mount(v3, { name: p.style, front_image: S.img(p.image), back_image: S.img(p.back), model_url: p.model ? S.img(p.model) : null }, { big: true }); } }, { rootMargin: "200px" }).observe(v3);

  /* size, quantity, add */
  let qty = 1;
  const f = $("pf");
  const pick = (s) => { const r = f.querySelector(`input[name=size][value="${CSS.escape(s)}"]`); if (r) { r.checked = true; r.dispatchEvent(new Event("change", { bubbles: true })); } };
  const fms = () => S.sizeSheet(p, (s) => { pick(s); const r = S.recommend(p, store.get("bb-fit", {})); $("fitnote").innerHTML = `<b>Size ${esc(s)} chosen.</b> ${r && r.size !== s ? "We suggested " + esc(r.size) + ", but it's your call." : "Good choice."}`; });
  if ($("fms")) $("fms").onclick = fms;
  f.addEventListener("click", (e) => {
    const q = e.target.closest("[data-q]"); if (q) { qty = Math.max(1, Math.min(10, qty + +q.dataset.q)); $("qv").textContent = qty; }
    if (e.target.closest("[data-refit]")) fms();
  });
  f.addEventListener("change", () => { $("perr").textContent = ""; const z = $("sz"); if (z) z.classList.remove("bad"); });
  f.onsubmit = (e) => {
    e.preventDefault();
    const size = (f.querySelector("input[name=size]:checked") || {}).value || "";
    if (p.sizes.length && !size) { $("perr").textContent = "Choose your size first, or tap Find my size."; $("sz").classList.add("bad"); $("sz").scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    S.add(p, size, qty); S.openCart();
  };

  /* the community around this piece */
  C.strip($("strip"), { product: p.id, limit: 30, hideEmpty: true }).then((posts) => { $("seen").hidden = false; if (!posts.length) $("seenempty").hidden = false; });
  if (S.hasDB) S.rpc("public_ambassadors").then((a) => {
    const wearing = (Array.isArray(a) ? a : []).filter((x) => (x.fits || []).some((r) => String(r).toLowerCase() === p.id.toLowerCase()));
    if (!wearing.length) return;
    $("onamb").hidden = false;
    $("ambs").innerHTML = wearing.map((x, i) => `<button class="person" type="button" data-i="${i}"><span class="pp">${C.safe(x.photo) ? `<img src="${esc(C.safe(x.photo))}" alt="">` : `<i>${esc(x.name.charAt(0))}</i>`}</span><span class="pn">${esc(x.name)}</span><span class="pc">${esc(x.city || "")}</span></button>`).join("");
    $("ambs").onclick = (e) => { const b = e.target.closest("[data-i]"); if (b) C.profile(wearing[+b.dataset.i]); };
  }).catch(() => {});

  /* related: other colours first, then everything else */
  const rel = [...sib.filter((x) => x.id !== p.id), ...list.filter((x) => x.style !== p.style)].slice(0, 4);
  if (rel.length) { $("more").hidden = false; $("rel").innerHTML = rel.map((x) => `<a href="${esc(S.pieceUrl(x))}"><img src="${esc(S.img(x.image))}" alt="" loading="lazy"><b>${esc(x.style)}</b><span>${esc(x.color)}${x.price != null ? " · " + esc(S.money(x.price, x.currency)) : ""}</span></a>`).join(""); }
  if (window.BBBird && BBBird.rescan) BBBird.rescan();
});
}
</script>
</body>
</html>
